name: JPL mean elements block probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the SAT415 element block
        run: |
          curl -sL --max-time 60 -o sep.html "https://ssd.jpl.nasa.gov/sats/elem/sep.html"
          sed -e 's/<[^>]*>/\n/g' sep.html | sed 's/&nbsp;/ /g; s/&amp;/\&/g' | grep -v '^[[:space:]]*$' > sep.txt
          echo "lines: $(wc -l < sep.txt)"
          L=$(grep -n 'SAT415' sep.txt | head -n 1 | cut -d: -f1)
          echo "SAT415 at line $L"
          sed -n "$((L)),$((L+45))p" sep.txt
          echo "--- numeric rows containing EC or IN:"
          grep -nE '(EC|IN|OM|W|A)[[:space:]]*=?[[:space:]]*[-+]?[0-9]' sep.txt | head -n 12
