name: Satellite photos (Wikimedia Commons, freely licensed)
on:
  schedule:
    - cron: "30 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sat-photos
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q requests
      - name: Build satellite photo list
        run: python3 tools/build_sat_photos.py
      - name: Commit if changed
        run: |
          git config user.name "vemmsunj-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/sat_photos.json
          if ! git diff --cached --quiet; then
            git commit -m "Update satellite photos (Wikimedia Commons)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
