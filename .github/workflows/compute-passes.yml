name: Compute pass predictions on GitHub

on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

concurrency:
  group: compute-passes
  cancel-in-progress: false

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Compute and store passes for every place
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 tools/compute_passes.py
