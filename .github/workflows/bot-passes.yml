name: Pass summaries (manual only)

on:
  workflow_dispatch:

jobs:
  passes:
    runs-on: ubuntu-latest
    steps:
      - name: Post pass summaries
        run: |
          curl -fsS --max-time 280 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://vemmsunj.onrender.com/api/cron/passes
