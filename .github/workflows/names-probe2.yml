name: Full moon name probe 2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Count all MPC moon entries per planet and sample Horizons
        run: |
          curl -sL --max-time 60 -o sat.html "https://www.minorplanetcenter.net/iau/NatSats/NaturalSatellites.html"
          sed -e 's/<[^>]*>/\n/g' sat.html | sed 's/&nbsp;/ /g' > text.txt
          for p in Jupiter Saturn Uranus Neptune Mars; do
            echo "$p lines mentioning it: $(grep -c "$p" text.txt)"
          done
          echo "--- Saturn lines with S/ designations:"
          grep -oE 'S/[0-9]{4} S [0-9]+' text.txt | sort -u | wc -l
          grep -oE 'S/[0-9]{4} S [0-9]+' text.txt | sort -u | head -n 5
          echo "--- Horizons Pan response head:"
          curl -s --max-time 60 -G "https://ssd.jpl.nasa.gov/api/horizons.api" \
            --data-urlencode "format=text" --data-urlencode "COMMAND=Pan" \
            --data-urlencode "OBJ_DATA=NO" --data-urlencode "MAKE_EPHEM=NO" -o pan.txt
          head -n 12 pan.txt
          echo "--- Horizons S/2004 S 12 response head:"
          curl -s --max-time 60 -G "https://ssd.jpl.nasa.gov/api/horizons.api" \
            --data-urlencode "format=text" --data-urlencode "COMMAND=S/2004 S 12" \
            --data-urlencode "OBJ_DATA=NO" --data-urlencode "MAKE_EPHEM=NO" -o s12.txt
          head -n 12 s12.txt
