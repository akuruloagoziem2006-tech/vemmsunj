name: Horizons elements probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Orbital elements for Mimas, and moon ID counts per planet
        run: |
          curl -s --max-time 60 "https://ssd.jpl.nasa.gov/api/horizons.api?format=text&COMMAND='601'&OBJ_DATA='NO'&MAKE_EPHEM='YES'&EPHEM_TYPE='ELEMENTS'&CENTER='500@699'&START_TIME='2026-01-01'&STOP_TIME='2026-01-02'&STEP_SIZE='1d'&REF_PLANE='ECLIPTIC'" -o mimas_el.txt
          echo "elements bytes: $(wc -c < mimas_el.txt)"
          sed -n '/\$\$SOE/,/\$\$EOE/p' mimas_el.txt | head -n 4
          curl -s --max-time 60 "https://ssd.jpl.nasa.gov/api/horizons.api?format=text&COMMAND='MB'" -o mb.txt
          echo "major bodies total lines: $(grep -cE '^ *[0-9]+ ' mb.txt)"
          for r in "Jupiter 500-599" "Saturn 600-699" "Uranus 700-799" "Neptune 800-899"; do
            set -- $r
            echo "$1 IDs in $2: $(grep -E '^ *[0-9]+ ' mb.txt | awk -v lo=${2%-*} -v hi=${2#*-} '$1>=lo && $1<=hi' | wc -l)"
          done
