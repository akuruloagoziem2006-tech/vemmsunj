name: MPC satellite page structure probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the natural satellites page
        run: |
          B="https://www.minorplanetcenter.net"
          curl -sL --max-time 60 -o sat.html -w "page: %{http_code} %{size_download} bytes\n" "$B/iau/NatSats/NaturalSatellites.html"
          echo "--- links mentioning NatSats or satellite data:"
          grep -oiE 'href="[^"]*(NatSat|satell|\.txt|\.dat|\.csv|\.json)[^"]*"' sat.html | sort -u | head -n 40
          echo "--- text around Jupiter, Saturn or Horizons:"
          sed -e 's/<[^>]*>/ /g' sat.html | grep -iE 'jupiter|saturn|uranus|neptune|ephemeris|elements|format' | head -n 40
          echo "--- table or pre blocks present:"
          grep -ciE '<pre|<table' sat.html
