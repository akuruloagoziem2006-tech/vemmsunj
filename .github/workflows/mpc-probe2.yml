name: MPC link discovery
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find MPC satellite links
        run: |
          curl -sL --max-time 60 -o mpc_home.html -w "home: %{http_code} %{size_download} bytes\n" "https://minorplanetcenter.net/"
          grep -oiE 'href="[^"]*(satell|moon|natural)[^"]*"' mpc_home.html | sort -u | head -n 20
          curl -sL --max-time 60 -o mpc_iau.html -w "iau: %{http_code} %{size_download} bytes\n" "https://www.minorplanetcenter.net/iau/NaturalSatellites/NaturalSatellites.html"
          grep -oiE 'href="[^"]+"' mpc_iau.html | sort -u | head -n 40
