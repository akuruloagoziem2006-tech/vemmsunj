name: Horizons name form probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try quoted names and numeric ID for Pan
        run: |
          try() {
            curl -s --max-time 60 -G "https://ssd.jpl.nasa.gov/api/horizons.api" \
              --data-urlencode "format=text" --data-urlencode "COMMAND=$1" \
              --data-urlencode "OBJ_DATA=YES" --data-urlencode "MAKE_EPHEM=NO" -o out.txt
            echo "== COMMAND=$1"
            grep -m2 -E 'Target body name|No matches|Multiple|No output' out.txt || head -n 3 out.txt
          }
          try "'618'"
          try "'Pan'"
          try "'Pan;'"
          try "'S/2004 S 12'"
          try "'S/2004 S 12;'"
