name: Precompute planets, sky card and tracker

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - name: Run every step for every place and filter
        run: |
          H="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          B="https://vemmsunj.onrender.com/api/cron/precompute"
          IDS=$(curl -fsS --max-time 120 -X POST -H "$H" "$B?step=ids" | python3 -c "import json,sys; print(' '.join(str(i) for i in json.load(sys.stdin)['ids']))")
          echo "places: $IDS"
          for id in $IDS; do
            for step in planets sky; do
              curl -fsS --max-time 280 -X POST -H "$H" "$B?step=$step&place=$id"; echo
              sleep 10
            done
          done
          curl -fsS --max-time 280 -X POST -H "$H" "$B?step=tracker"; echo
