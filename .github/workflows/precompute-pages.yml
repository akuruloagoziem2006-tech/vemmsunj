name: Precompute planets, sky card, posts, home and tracker

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

concurrency:
  group: render-precompute
  cancel-in-progress: false

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - name: Run every step, retrying each call
        run: |
          H="Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          B="https://vemmsunj.onrender.com/api/cron/precompute"
          FAILED=""
          healthy() {
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 https://vemmsunj.onrender.com/healthz >/dev/null; then return 0; fi
              echo "instance not healthy, waiting 60s"; sleep 60
            done
            return 1
          }
          healthy() {
            for i in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 https://vemmsunj.onrender.com/healthz >/dev/null; then return 0; fi
              echo "instance not healthy, waiting 60s"; sleep 60
            done
            return 1
          }
          call() {
            for attempt in 1 2 3; do
              healthy || { FAILED="$FAILED [$1]"; return 1; }
              healthy || { FAILED="$FAILED [$1]"; return 1; }
              if curl -fsS --max-time 280 -X POST -H "$H" "$B?$1"; then echo; return 0; fi
              echo "attempt $attempt failed for $1"; sleep 90
            done
            FAILED="$FAILED [$1]"; return 1
          }
          IDS=$(curl -fsS --max-time 120 -X POST -H "$H" "$B?step=ids" | python3 -c "import json,sys; print(' '.join(str(i) for i in json.load(sys.stdin)['ids']))")
          echo "places: $IDS"
          for id in $IDS; do
            for step in planets sky post; do
              call "step=$step&place=$id" || true
              sleep 30
            done
          done
          call "step=home" || true
          call "step=tracker" || true
          if [ -n "$FAILED" ]; then echo "failed steps:$FAILED"; exit 1; fi
