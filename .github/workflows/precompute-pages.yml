name: Precompute planets, sky card and tracker

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

jobs:
  precompute:
    runs-on: ubuntu-latest
    steps:
      - name: Run each precompute step in turn
        run: |
          for step in planets sky tracker; do
            curl -fsS --max-time 280 -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://vemmsunj.onrender.com/api/cron/precompute?step=$step"
            echo
            sleep 20
          done
