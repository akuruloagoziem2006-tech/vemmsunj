name: MPC ephemeris terms and form probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read terms and the ephemeris form
        run: |
          B="https://www.minorplanetcenter.net"
          curl -sL --max-time 60 -o terms.html -w "terms: %{http_code}\n" "$B/mpcops/terms/" || true
          curl -sL --max-time 60 -o eph.html -w "eph page: %{http_code}\n" "$B/iau/NatSats/NaturalSatellites.html"
          echo "--- terms text mentioning automated access, robots, or scraping:"
          sed -e 's/<[^>]*>/ /g' terms.html 2>/dev/null | grep -iE 'automat|robot|scrap|bulk|crawl|programmatic|api|licen' | head -n 20
          echo "--- robots.txt:"
          curl -sL --max-time 60 "$B/robots.txt" | head -n 30
          echo "--- form tags and fields on the ephemeris page:"
          grep -oiE '<form[^>]*>|<input[^>]*name="[^"]*"[^>]*>|<select[^>]*name="[^"]*"' eph.html | head -n 40
          echo "--- form action target:"
          grep -oiE 'action="[^"]*"' eph.html | head -n 5
