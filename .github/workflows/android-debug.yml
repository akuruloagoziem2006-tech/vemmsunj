name: Debug Android app on an emulator

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Enable hardware acceleration for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the latest built APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-build.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Using build run $RUN"
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name vemmsunj-android --dir apk
          APK=$(find apk -name "*.apk" | head -1)
          echo "APK: $APK"
          cp "$APK" app.apk

      - name: Show the app's manifest
        run: |
          AAPT=$(find /usr/local/lib/android/sdk/build-tools -name aapt | sort -V | tail -1)
          echo "aapt: $AAPT"
          "$AAPT" dump badging app.apk | head -15
          "$AAPT" dump xmltree app.apk AndroidManifest.xml | grep -E "activity|intent|action|category|data|name|exported|minSdk|targetSdk|launchMode" | head -80

      - name: Run the app on an emulator and capture its log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.akuruloagoziem.vemmsunj -c android.intent.category.LAUNCHER 1
            sleep 40
            adb shell pidof com.akuruloagoziem.vemmsunj || echo "APP IS NOT RUNNING"
            adb logcat -d > logcat.txt

      - name: Show the crash lines
        if: always()
        run: |
          if [ -f logcat.txt ]; then
            grep -nE "FATAL|AndroidRuntime|Caused by|Exception|vemmsunj" logcat.txt | head -80
          else
            echo "No log captured"
          fi

      - name: Upload the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-logcat
          path: logcat.txt
          if-no-files-found: ignore
