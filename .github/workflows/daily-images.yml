name: Daily NASA images (APOD and EPIC)

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: render-precompute
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Post today's NASA images
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if curl -fsS --max-time 600 -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                 https://vemmsunj.onrender.com/api/cron/daily; then echo; exit 0; fi
            echo "attempt $attempt failed"; sleep 60
          done
          exit 1
