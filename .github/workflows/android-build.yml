name: Build Android app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that the signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Missing ANDROID_KEYSTORE_B64 or ANDROID_KEYSTORE_PASSWORD secret."
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the SDK packages Bubblewrap needs
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "installed packages:"
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:"; ls "$SDK/platforms"

      - name: Point Bubblewrap and Gradle at the runner's Android SDK
        run: |
          SDK=/usr/local/lib/android/sdk
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$SDK" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          cat local.properties

      - name: Print the signing fingerprint
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android.keystore -alias vemmsunj -storepass "$KEYSTORE_PASS" | grep "SHA256:" | head -1

      - name: Generate the Android project from the manifest
        run: |
          npx --yes @bubblewrap/cli@1.27.0 update --manifest=twa-manifest.json --skipVersionUpgrade < /dev/null
          printf 'sdk.dir=/usr/local/lib/android/sdk\n' > local.properties
          ls -la

      - name: Build the app with Gradle
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -la
          cd android-project 2>/dev/null || cd .
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias=vemmsunj \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASS"
          find . -name "*.aab" -o -name "*.apk" | grep release

      - name: Upload the app files
        uses: actions/upload-artifact@v4
        with:
          name: vemmsunj-android
          path: |
            **/app/build/outputs/bundle/release/*.aab
            **/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
