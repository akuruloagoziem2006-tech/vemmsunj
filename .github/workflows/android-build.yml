name: Build Android app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that the signing secrets exist
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "Missing ANDROID_KEYSTORE_B64 or ANDROID_KEYSTORE_PASSWORD secret."
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the SDK packages Bubblewrap needs
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -1)"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "installed packages:"
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed
          echo "build-tools:"; ls "$SDK/build-tools"
          echo "platforms:"; ls "$SDK/platforms"

      - name: Let Bubblewrap use its own Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$HOME/.bubblewrap/android_sdk" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Print the signing fingerprint
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android.keystore -alias vemmsunj -storepass "$KEYSTORE_PASS" | grep "SHA256:" | head -1

      - name: Generate the Android project from the manifest
        run: |
          npx --yes @bubblewrap/cli@1.27.0 update --manifest=twa-manifest.json --skipVersionUpgrade < /dev/null
          ls -la

      - name: Show the generated Android settings
        run: |
          echo "== local.properties =="; cat local.properties 2>/dev/null || echo "(none)"
          echo "== gradle.properties =="; cat gradle.properties 2>/dev/null || echo "(none)"
          echo "== twa-manifest.json (sdk fields) =="; grep -iE "sdk|jdk|path" twa-manifest.json || true
          echo "== ~/.bubblewrap/config.json =="; cat ~/.bubblewrap/config.json 2>/dev/null || echo "(none)"
          echo "== android_sdk folder =="; ls ~/.bubblewrap/android_sdk 2>/dev/null || echo "(missing)"
          echo "== build-tools installed =="; ls ~/.bubblewrap/android_sdk/build-tools 2>/dev/null || echo "(missing)"
          echo "== platforms installed =="; ls ~/.bubblewrap/android_sdk/platforms 2>/dev/null || echo "(missing)"
          exit 1

      - name: Build the app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npx --yes @bubblewrap/cli@1.27.0 build --skipPwaValidation

      - name: Upload the app files
        uses: actions/upload-artifact@v4
        with:
          name: vemmsunj-android
          path: |
            app-release-bundle.aab
            app-release-signed.apk
          if-no-files-found: error
